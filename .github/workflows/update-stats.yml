name: Update live stats

on:
  schedule:
    # 06:00 UTC every day
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "package.json"

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate hero + stat cards
        run: npm run generate

      - name: Publish assets/ to live-stats branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stash the freshly generated assets so they survive the branch switch.
          mkdir -p /tmp/live-stats-assets
          cp -r assets/. /tmp/live-stats-assets/

          git fetch origin live-stats || true
          if git show-ref --verify --quiet refs/remotes/origin/live-stats; then
            git checkout -B live-stats origin/live-stats
          else
            git checkout --orphan live-stats
            git rm -rf . > /dev/null 2>&1 || true
          fi

          mkdir -p assets
          rm -rf assets/*
          cp -r /tmp/live-stats-assets/. assets/

          git add assets
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "chore: refresh live stats [skip ci]"
            git push origin live-stats
          fi
